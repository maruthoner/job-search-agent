name: Diagnose API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump every date field the API returns
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          key = os.environ["RAPIDAPI_KEY"].strip()
          host = "jsearch.p.rapidapi.com"

          for q in ("chief of staff in United States",
                    "product manager in New York, NY"):
              p = {"query": q, "country": "us", "language": "en",
                   "employment_types": "FULLTIME,CONTRACTOR"}
              url = f"https://{host}/search-v2?" + urllib.parse.urlencode(p)
              req = urllib.request.Request(url, headers={
                  "X-RapidAPI-Key": key, "X-RapidAPI-Host": host})
              with urllib.request.urlopen(req, timeout=45) as r:
                  pl = json.loads(r.read().decode())
                  left = r.headers.get("x-ratelimit-requests-remaining")
              jobs = (pl.get("data") or {}).get("jobs") or []
              print(f"\n=== {q}  ({len(jobs)} jobs, {left} requests left)")
              print(f"{'job_posted_at':18} {'..._datetime_utc':26} {'..._timestamp':14} TITLE")
              for j in jobs:
                  print(f"{str(j.get('job_posted_at')):18} "
                        f"{str(j.get('job_posted_at_datetime_utc')):26} "
                        f"{str(j.get('job_posted_at_timestamp')):14} "
                        f"{str(j.get('job_title'))[:40]}")
          PY
