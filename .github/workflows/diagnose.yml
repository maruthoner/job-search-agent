name: Diagnose API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the search-v2 endpoint
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          key = os.environ["RAPIDAPI_KEY"].strip()
          host = "jsearch.p.rapidapi.com"
          params = {
              "query": "product manager in New York, NY",
              "country": "us",
              "language": "en",
              "date_posted": "3days",
              "employment_types": "FULLTIME,CONTRACTOR",
          }
          url = f"https://{host}/search-v2?" + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={
              "X-RapidAPI-Key": key, "X-RapidAPI-Host": host})
          try:
              with urllib.request.urlopen(req, timeout=45) as r:
                  payload = json.loads(r.read().decode())
                  print(f"STATUS {r.status}  "
                        f"remaining={r.headers.get('x-ratelimit-requests-remaining')}")
          except urllib.error.HTTPError as e:
              print(f"STATUS {e.code}")
              print(e.read().decode(errors="replace")[:500])
              raise SystemExit(0)

          data = payload.get("data")
          print("type(data):", type(data).__name__)
          if isinstance(data, dict):
              print("data keys:", list(data.keys()))
              for k, v in data.items():
                  print(f"  data[{k!r}] is {type(v).__name__}"
                        + (f", len {len(v)}" if hasattr(v, "__len__") else ""))
              jobs = next((v for v in data.values() if isinstance(v, list)), [])
          else:
              jobs = data or []
          print(f"\njob records found: {len(jobs)}")
          if jobs:
              rec = jobs[0]
              print("field names on a job record:")
              for k in sorted(rec):
                  v = rec[k]
                  prev = repr(v[:90]) if isinstance(v, str) else json.dumps(v)[:90]
                  print(f"  {k:32} {prev}")
          PY
