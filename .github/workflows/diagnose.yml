name: Diagnose API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find which filter drops the results
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          key = os.environ["RAPIDAPI_KEY"].strip()
          host = "jsearch.p.rapidapi.com"
          base = {"query": "product manager in New York, NY",
                  "country": "us", "language": "en"}

          variants = [
              ("baseline, no filters", {}),
              ("date_posted=3days", {"date_posted": "3days"}),
              ("date_posted=week", {"date_posted": "week"}),
              ("employment_types only", {"employment_types": "FULLTIME,CONTRACTOR"}),
              ("remote_jobs_only", {"query": "product manager in United States",
                                    "work_from_home": "true"}),
          ]

          for name, extra in variants:
              p = dict(base); p.update(extra)
              url = f"https://{host}/search-v2?" + urllib.parse.urlencode(p)
              req = urllib.request.Request(url, headers={
                  "X-RapidAPI-Key": key, "X-RapidAPI-Host": host})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      pl = json.loads(r.read().decode())
                      left = r.headers.get("x-ratelimit-requests-remaining")
              except urllib.error.HTTPError as e:
                  print(f"{name:26} HTTP {e.code}: "
                        f"{e.read().decode(errors='replace')[:160]}")
                  continue
              jobs = (pl.get("data") or {}).get("jobs") or []
              print(f"{name:26} {len(jobs):3} jobs   (left={left})")
              print(f"{'':26} echoed: {json.dumps(pl.get('parameters'))[:200]}")
              if jobs and name == "baseline, no filters":
                  print("\n  --- field names on a job record ---")
                  for k in sorted(jobs[0]):
                      v = jobs[0][k]
                      prev = repr(v[:80]) if isinstance(v, str) else json.dumps(v)[:80]
                      print(f"    {k:32} {prev}")
                  print()
          PY
