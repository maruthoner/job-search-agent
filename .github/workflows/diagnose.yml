name: Diagnose API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the search-v2 endpoint
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          key = os.environ["RAPIDAPI_KEY"].strip()
          host = "jsearch.p.rapidapi.com"
          params = {
              "query": "product manager in New York, NY",
              "country": "us",
              "language": "en",
              "date_posted": "3days",
              "employment_types": "FULLTIME,CONTRACTOR",
          }
          url = f"https://{host}/search-v2?" + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={
              "X-RapidAPI-Key": key, "X-RapidAPI-Host": host})
          try:
              with urllib.request.urlopen(req, timeout=45) as r:
                  payload = json.loads(r.read().decode())
                  print(f"STATUS {r.status}  "
                        f"remaining={r.headers.get('x-ratelimit-requests-remaining')}")
          except urllib.error.HTTPError as e:
              print(f"STATUS {e.code}")
              print(e.read().decode(errors="replace")[:500])
              raise SystemExit(0)

          print("top-level keys:", list(payload.keys()))
          print("echoed parameters:", json.dumps(payload.get("parameters"), indent=2))
          data = payload.get("data") or []
          print(f"results: {len(data)}")
          if data:
              rec = data[0]
              print("\nfield names on a job record:")
              for k in sorted(rec):
                  v = rec[k]
                  prev = json.dumps(v)[:80] if not isinstance(v, str) else repr(v[:80])
                  print(f"  {k:34} {prev}")
          PY
