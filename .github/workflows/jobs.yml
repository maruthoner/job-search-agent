name: Job search

on:
  schedule:
    # GitHub's scheduler delays and sometimes silently drops cron firings, so
    # this asks several times a day rather than once. agent.py runs the search
    # only if today's run is still outstanding and it is past 9:15am in New
    # York, so the FIRST firing GitHub actually delivers does the work and every
    # later one exits in seconds without spending an API call. Minutes are off
    # the hour on purpose - the top of the hour is the most congested and the
    # most likely to be dropped.
    # Times are UTC; both daylight saving (UTC-4) and standard (UTC-5) covered.
    - cron: '17 13 * * *'   #  9:17am EDT  /  8:17am EST (EST: too early, skips)
    - cron: '47 13 * * *'   #  9:47am EDT  /  8:47am EST (EST: too early, skips)
    - cron: '17 14 * * *'   # 10:17am EDT  /  9:17am EST
    - cron: '47 14 * * *'   # 10:47am EDT  /  9:47am EST
    - cron: '17 16 * * *'   # 12:17pm EDT  / 11:17am EST  - midday catch-up
    - cron: '17 20 * * *'   #  4:17pm EDT  /  3:17pm EST  - late catch-up
  workflow_dispatch:
    inputs:
      include_jsearch:
        description: 'Also run the weekly JSearch sweep (normally Mondays only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Search for jobs and rebuild the dashboard
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.include_jsearch }}" = "true" ]; then
              python3 agent.py --force --jsearch
            else
              python3 agent.py --force --adzuna-only
            fi
          else
            python3 agent.py
          fi

      - name: Commit the updated dashboard
        run: |
          git config user.name  "job-search-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing changed this run."
            exit 0
          fi
          git commit -m "Job board update - $(TZ=America/New_York date '+%b %-d %Y')"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing and retrying ($attempt)"
            git pull --rebase --autostash
          done
          exit 1
