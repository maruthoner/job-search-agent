name: Job search

on:
  schedule:
    # Times are UTC. Two entries so the run lands at 9:15am New York time in
    # both daylight saving and standard time. agent.py checks the actual New
    # York clock and skips any firing that is not the real 9:15am window, so
    # exactly one run happens per day and no API quota is wasted.
    - cron: '15 13 * * *'   # 9:15am ET during daylight saving time
    - cron: '15 14 * * *'   # 9:15am ET during standard time
  workflow_dispatch:
    inputs:
      all_themes:
        description: 'Search all five title themes (10 requests instead of 6)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Search for jobs and rebuild the dashboard
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.all_themes }}" = "true" ]; then
              python3 agent.py --all
            else
              python3 agent.py --force
            fi
          else
            python3 agent.py
          fi

      - name: Commit the updated dashboard
        run: |
          git config user.name  "job-search-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing changed this run."
            exit 0
          fi
          git commit -m "Job board update - $(TZ=America/New_York date '+%b %-d %Y')"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing and retrying ($attempt)"
            git pull --rebase --autostash
          done
          exit 1
