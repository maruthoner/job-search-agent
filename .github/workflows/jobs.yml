name: Job search

on:
  schedule:
    # GitHub's scheduler is unreliable on this repo: firings arrive over an hour
    # late or never arrive at all. Rather than guess which times it will honour,
    # ask every hour and let the script decide. agent.py runs the search only if
    # today's run is still outstanding and it is past 9:15am in New York, so:
    #   - the first firing GitHub actually delivers does the work
    #   - every other firing exits in about ten seconds, spending no API calls
    #   - a late run still happens, which beats no run
    # This repo is public, so Actions minutes are unmetered and the idle firings
    # are free. Minute :17 avoids the congested top of the hour.
    - cron: '17 * * * *'          # every hour, on the hour + 17 minutes
    - cron: '47 13,14,15 * * *'   # extra tries through the ET morning
  workflow_dispatch:
    inputs:
      include_jsearch:
        description: 'Also run the weekly JSearch sweep (normally Mondays only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Search for jobs and rebuild the dashboard
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.include_jsearch }}" = "true" ]; then
              python3 agent.py --force --jsearch
            else
              python3 agent.py --force --adzuna-only
            fi
          else
            python3 agent.py
          fi

      - name: Commit the updated dashboard
        run: |
          git config user.name  "job-search-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing changed this run."
            exit 0
          fi
          git commit -m "Job board update - $(TZ=America/New_York date '+%b %-d %Y')"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing and retrying ($attempt)"
            git pull --rebase --autostash
          done
          exit 1
